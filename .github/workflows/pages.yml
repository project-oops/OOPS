name: Deploy landing page to GitHub Pages

# Publishes the landing page (frontend/web) and docs/ to project-oops.github.io/OOPS/.

on:
  push:
    branches: [main]
    paths:
      - "frontend/web/**"
      - "docs/**"
      - "tools/build-docs.sh"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build site bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Assemble bundle
        # The collection has no accent colour of its own; its docs use a neutral grey.
        run: |
          set -euo pipefail
          mkdir -p site/assets
          cp -r frontend/web/. site/
          cp assets/logo.svg site/assets/

          # The four project icons, fetched from their repositories; `-f` fails on a missing one.
          for pair in Orbistoun:orbistoun obSCEne:obscene Prosperous:prosperous SELFish:selfish; do
            repo="${pair%%:*}"; name="${pair##*:}"
            curl -fsSL -o "site/assets/$name.svg" \
              "https://raw.githubusercontent.com/${{ github.repository_owner }}/$repo/main/assets/logo.svg"
          done

          bash tools/build-docs.sh . site "#8b9096" "OOPS"
          du -sh site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
