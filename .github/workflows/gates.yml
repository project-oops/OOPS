# The collection gates, which span repositories and so run here (CONVENTIONS section 5).
name: gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly, against the pinned submodule revisions.
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # The gates read every repository; a missing one fails rather than passing empty.
      - name: The four are present
        run: |
          missing=""
          for p in orbistoun obscene prosperous selfish oops-libs; do
            if [ ! -d "$p/docs" ]; then missing="$missing $p"; fi
          done
          if [ -n "$missing" ]; then
            echo "not checked out:$missing"
            echo ""
            echo "The gates span every repository; see docs/PUBLISHING.md."
            exit 1
          fi

      # Through bin/oops, so CI runs the command a person runs.
      - name: Gates
        run: ./bin/oops gates
