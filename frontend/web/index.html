<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OOPS</title>
<meta name="description" content="Four projects aimed at one platform: an emulator, a conformance probe, remote management, and the file formats underneath them.">
<link rel="icon" href="assets/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
/* The four projects each own a colour, taken from their own logo. This page is
   the one place all four meet, so it has no accent of its own: the acronym is
   coloured a letter per project, and the frame is a gradient through the same
   four in the same order. */
:root {
  --orbistoun: #f0474b;
  --obscene:   #3ddc84;
  --prosperous:#4da6ff;
  --selfish:   #f45fa9;
  --bg: #000000;
  --fg: #f2f2f2;
  --muted: #8b9096;
  --frame-width: 14px;
  --frame-radius: 44px;
  --frame-gap: 18px;
  --pixel: "Press Start 2P", "Courier New", monospace;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  min-height: 100%;
  background: var(--bg);
  color: var(--fg);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}

/* `border-image` ignores `border-radius`, so the gradient is a padded backdrop
   with the page inset on top of it - the only way to get a rounded multi-colour
   edge that holds at every corner. */
.frame {
  margin: var(--frame-gap);
  padding: var(--frame-width);
  border-radius: var(--frame-radius);
  background: linear-gradient(135deg,
    var(--orbistoun) 0%, var(--obscene) 34%, var(--prosperous) 67%, var(--selfish) 100%);
  min-height: calc(100vh - (var(--frame-gap) * 2));
}

.inner {
  background: var(--bg);
  border-radius: calc(var(--frame-radius) - var(--frame-width));
  min-height: calc(100vh - (var(--frame-gap) * 2) - (var(--frame-width) * 2));
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2.2rem;
  padding: 3rem 1.5rem;
  text-align: center;
}

h1 {
  font-family: var(--pixel);
  font-size: clamp(2.5rem, 12vw, 6rem);
  line-height: 1.3;
  margin: 0;
  letter-spacing: 0.06em;
}

/* One letter per project, in that project's own colour. */
h1 .o1 { color: var(--orbistoun); }
h1 .o2 { color: var(--obscene); }
h1 .p  { color: var(--prosperous); }
h1 .s  { color: var(--selfish); }

.expand {
  font-family: var(--pixel);
  font-size: clamp(0.55rem, 1.9vw, 0.75rem);
  line-height: 2.2;
  margin: 0;
  color: var(--muted);
}
.expand b { font-weight: normal; }
.expand .o1 { color: var(--orbistoun); }
.expand .o2 { color: var(--obscene); }
.expand .p  { color: var(--prosperous); }
.expand .s  { color: var(--selfish); }

.tagline {
  margin: 0;
  max-width: 52ch;
  font-size: clamp(0.95rem, 2.2vw, 1.15rem);
  line-height: 1.6;
  color: var(--muted);
}

/* The pad's four face buttons. A 3x3 grid with one icon in the middle of each
   edge is the same arrangement as the logo - which is these same four icons -
   so the mark and the navigation are one idea rather than two. */
.projects {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  grid-template-rows: repeat(3, 1fr);
  width: min(58vmin, 400px);
  aspect-ratio: 1 / 1;
}

.card {
  display: block;
  text-decoration: none;
  transition: transform 90ms ease, filter 90ms ease;
}
.card img { display: block; width: 100%; height: auto; }

.card.obscene    { grid-area: 1 / 2 / 2 / 3; }
.card.orbistoun  { grid-area: 2 / 3 / 3 / 4; }
.card.prosperous { grid-area: 3 / 2 / 4 / 3; }
.card.selfish    { grid-area: 2 / 1 / 3 / 2; }

/* Each icon already carries its own colour and border, so hover lifts it and
   lights it in its own accent rather than repainting anything. */
.card:hover, .card:focus-visible { transform: scale(1.07); }
.card.orbistoun:hover,  .card.orbistoun:focus-visible  { filter: drop-shadow(0 0 14px var(--orbistoun)); }
.card.obscene:hover,    .card.obscene:focus-visible    { filter: drop-shadow(0 0 14px var(--obscene)); }
.card.prosperous:hover, .card.prosperous:focus-visible { filter: drop-shadow(0 0 14px var(--prosperous)); }
.card.selfish:hover,    .card.selfish:focus-visible    { filter: drop-shadow(0 0 14px var(--selfish)); }

.foot { margin: 0; }
.foot a {
  font-family: var(--pixel);
  font-size: 0.65rem;
  color: var(--muted);
  text-decoration: none;
  border-bottom: 2px solid var(--muted);
  padding-bottom: 0.25rem;
}
.foot a:hover { color: var(--fg); border-color: var(--fg); }

@media (prefers-reduced-motion: reduce) {
  .card { transition: none; }
  .card:hover, .card:focus-visible { transform: none; }
}
</style>
</head>
<body>
  <main class="frame">
    <div class="inner">
      <h1><span class="o1">O</span><span class="o2">O</span><span class="p">P</span><span class="s">S</span></h1>

      <p class="expand">
        <span class="o1"><b>O</b>rbistoun</span>, <span class="o2"><b>o</b>bSCEne</span>,
        <span class="p"><b>P</b>rosperous</span>, <span class="s"><b>S</b>ELFish</span>
      </p>

      <p class="tagline">
        Four projects aimed at one platform: an emulator, a conformance probe,
        remote management, and the file formats underneath them.
      </p>

      <nav class="projects" aria-label="The four projects">
        <a class="card obscene"    href="../obSCEne/"><img src="assets/obscene.svg" alt="obSCEne"></a>
        <a class="card orbistoun"  href="../Orbistoun/"><img src="assets/orbistoun.svg" alt="orbistoun"></a>
        <a class="card prosperous" href="../Prosperous/"><img src="assets/prosperous.svg" alt="Prosperous"></a>
        <a class="card selfish"    href="../SELFish/"><img src="assets/selfish.svg" alt="SELFish"></a>
      </nav>

      <p class="foot"><a href="docs/">Conventions, architecture, building</a></p>
    </div>
  </main>
</body>
</html>
